<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | Expense Tracker</title>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/reports.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- ================= Sidebar ================= -->

<aside class="sidebar">

    <div class="logo">

        <i class="fa-solid fa-wallet"></i>

        <span>Expense Tracker</span>

    </div>

    <nav>

        <a href="dashboard.html" class="nav-link">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>

        <a href="transactions.html" class="nav-link">
            <i class="fa-solid fa-wallet"></i>
            Transactions
        </a>

        <a href="reports.html" class="nav-link active">
            <i class="fa-solid fa-chart-line"></i>
            Reports
        </a>

        <a href="settings.html" class="nav-link">
            <i class="fa-solid fa-gear"></i>
            Settings
        </a>

    </nav>

    <div class="sidebar-bottom">

        <button id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</aside>

<!-- ================= Main ================= -->

<main class="main-content">

    <div class="page-header">

        <div>

            <h1>Reports</h1>

            <p>Track your financial insights</p>

        </div>

    </div>

<!-- ================= Filters ================= -->

<div class="filter-card">

<select id="month">

<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6">June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>

</select>

<select id="year">

    <option value="2022">2022</option>

    <option value="2023">2023</option>

    <option value="2024">2024</option>

    <option value="2025">2025</option>

    <option value="2026">2026</option>

    <option value="2027">2027</option>

    <option value="2028">2028</option>

    <option value="2029">2029</option>

    <option value="2030">2030</option>

</select>

<button id="generateReport">

<i class="fa-solid fa-chart-column"></i>

Generate Report

</button>

</div>

<!-- ================= Summary Cards ================= -->

<div class="summary-grid">

<div class="summary-card">

<h4>Total Income</h4>

<h2 id="reportIncome">₹0</h2>

</div>

<div class="summary-card">

<h4>Total Expense</h4>

<h2 id="reportExpense">₹0</h2>

</div>

<div class="summary-card">

<h4>Balance</h4>

<h2 id="reportBalance">₹0</h2>

</div>

<div class="summary-card">

<h4>Transactions</h4>

<h2 id="reportTransactions">0</h2>

</div>

</div>

<!-- ================= Income Expense Chart ================= -->

<div class="chart-card">

<h2>Income vs Expense</h2>

<div class="line-chart-container">

<canvas id="incomeExpenseChart"></canvas>

</div>

</div>

<!-- ================= Category Chart ================= -->

<div class="chart-card">

<h2>Expense By Category</h2>

<div class="pie-chart-container">

<canvas id="categoryChart"></canvas>

</div>

</div>

</main>

<script src="../js/api.js"></script>
<script src="../js/reports.js"></script>

</body>
</html>
